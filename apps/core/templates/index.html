{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Regalería Ramos - Sistema de Inventario{% endblock %}</title>
    
    <!-- Preconnect para mejorar performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/icono_tienda.png' %}">
    
    <!-- PWA Manifest (preparado para futuro) -->
    <meta name="theme-color" content="#FF0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="{% static '/images/icono_tienda.png' %}" 
                     alt="Regalería Ramos" class="logo-navbar">
                <span>Regalería Ramos</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">
                            <i class="bi bi-house-fill" aria-hidden="true"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listado_productos' %}">
                            <i class="bi bi-box-seam-fill" aria-hidden="true"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_categorias' %}">
                            <i class="bi bi-box-seam-fill" aria-hidden="true"></i> Categorias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'crear_producto' %}">
                            <i class="bi bi-plus-circle-fill" aria-hidden="true"></i> Nuevo Producto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'crear_categoria' %}">
                            <i class="bi bi-plus-circle-fill" aria-hidden="true"></i> Nueva Categoría
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                           aria-label="Menú de usuario">
                            <i class="bi bi-person-circle" aria-hidden="true"></i> {{ session.nombre_usuario }}
                            <span class="badge bg-danger">Admin</span>
                            <span class="badge bg-info">Empleado</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href=""
                                   aria-label="Cerrar sesión">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Cerrar Sesión
                            </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    
    
</body>
</html>
